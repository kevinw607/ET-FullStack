server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalogo-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/catalogo/**

        - id: crm-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/crm/**

        - id: envios-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/envios/**

        - id: facturacion-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/facturas/**

        - id: finanzas-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/finanzas/**

        - id: inventario-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/inventarios/**

        - id: notificaciones-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notificaciones/**

        - id: precios-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/precios/**

        - id: seguridad-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/usuarios/**

        - id: ventas-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/ventas/**